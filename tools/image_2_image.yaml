      - value: "1424x800"
        label:
          en_US: "5.0 Pro 1K · 16:9 (1424x800)"
          zh_Hans: "5.0 Pro 1K · 16:9 (1424x800)"
      - value: "800x1424"
        label:
          en_US: "5.0 Pro 1K · 9:16 (800x1424)"
          zh_Hans: "5.0 Pro 1K · 9:16 (800x1424)"
      - value: "1568x672"
        label:
          en_US: "5.0 Pro 1K · 21:9 (1568x672)"
          zh_Hans: "5.0 Pro 1K · 21:9 (1568x672)"
      - value: "1280x720"
        label:
          en_US: "4.0 1K · 16:9 (1280x720)"
          zh_Hans: "4.0 1K · 16:9 (1280x720)"
      - value: "720x1280"
        label:
          en_US: "4.0 1K · 9:16 (720x1280)"
          zh_Hans: "4.0 1K · 9:16 (720x1280)"
      - value: "1512x648"
        label:
          en_US: "4.0 1K · 21:9 (1512x648)"
          zh_Hans: "4.0 1K · 21:9 (1512x648)"
  - name: output_format
    type: select
    required: false
    label:
      en_US: Output Format
      zh_Hans: 输出格式
    human_description:
      en_US: "Output image format. Only effective for Seedream 5.0 Pro/Lite; ignored by 4.5/4.0"
      zh_Hans: "输出图像格式，仅对 Seedream 5.0 Pro/Lite 生效，4.5/4.0 会忽略此参数"
    llm_description: "Output image format (png/jpeg), only effective for 5.0 Pro/Lite"
    form: form
    default: "jpeg"
    options:
      - value: "jpeg"
        label:
          en_US: "JPEG"
          zh_Hans: "JPEG"
      - value: "png"
        label:
          en_US: "PNG"
          zh_Hans: "PNG"
  - name: watermark
    type: select
    required: false
    label:
      en_US: Watermark
      zh_Hans: 水印
    human_description:
      en_US: "Whether to add 'AI Generated' watermark to the image"
      zh_Hans: "是否在图像上添加'AI生成'水印"
    llm_description: "Whether to add 'AI Generated' watermark to the image"
    form: form
    default: "true"
    options:
      - value: "true"
        label:
          en_US: "Enabled"
          zh_Hans: "启用"
      - value: "false"
        label:
          en_US: "Disabled"
          zh_Hans: "禁用"
  - name: model
    type: select
    required: false
    label:
      en_US: Model Version
      zh_Hans: 模型版本
    human_description:
      en_US: "Choose the Seedream model version to use"
      zh_Hans: "选择要使用的Seedream模型版本"
    llm_description: "Choose the Seedream model version to use"
    form: form
    default: "doubao-seedream-4-5-251128"
    options:
      - value: "doubao-seedream-4-0-250828"
        label:
          en_US: "Seedream4.0"
          zh_Hans: "Seedream4.0"
      - value: "doubao-seedream-4-5-251128"
        label:
          en_US: "Seedream4.5"
          zh_Hans: "Seedream4.5"
      - value: "doubao-seedream-5-0-260128"
        label:
          en_US: "Seedream5.0 Lite"
          zh_Hans: "Seedream5.0 Lite"
      - value: "doubao-seedream-5-0-pro-260628"
        label:
          en_US: "Seedream5.0 Pro"
          zh_Hans: "Seedream5.0 Pro"
extra:
  python:
    source: tools/image_2_image.py
