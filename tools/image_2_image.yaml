identity:
  name: "imagefile2image"
  author: "sawyer-shi"
  label:
    en_US: "Seedream Image to Image"
    zh_Hans: "Seedream-图生图"
description:
  human:
    en_US: "Generate images from text and a reference image using Volcengine Doubao Seedream models"
    zh_Hans: "使用Seedream模型根据文本描述和参考图像生成图像"
  llm: "Generate images from text and a reference image using Volcengine Doubao Seedream models"
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: "Text description of the image you want to generate"
      zh_Hans: "您想要生成的图像的文本描述"
    llm_description: "Text description of the image to generate"
    form: llm
  - name: input_image_file
    type: file
    required: true
    label:
      en_US: Reference Image File
      zh_Hans: 参考图片文件
    human_description:
      en_US: "Reference image file for generation (jpeg, png, webp, bmp, tiff, gif; <=10MB)"
      zh_Hans: "用于生成的参考图片文件（jpeg、png、webp、bmp、tiff、gif；<=10MB）"
    llm_description: "Reference image file to use for generation"
    form: llm
  - name: size
    type: select
    required: false
    label:
      en_US: Image Size
      zh_Hans: 图像尺寸
    human_description:
      en_US: "Size of the generated image. Options are tagged with the model tier they belong to; mismatched size+model combinations will be rejected at runtime."
      zh_Hans: "生成图像的尺寸。下拉项已标注所属模型/档位，模型与尺寸不匹配会在运行时被拦截"
    llm_description: "Size of the generated image (see option labels for model-specific tiers)"
    form: form
    default: "2048x2048"
    options:
      # ===== 通用 2K（4 个模型都支持） =====
      - value: "2048x2048"
        label:
          en_US: "Universal 2K · 1:1 (2048x2048)"
          zh_Hans: "通用 2K · 1:1 (2048x2048)"
      - value: "2304x1728"
        label:
          en_US: "Universal 2K · 4:3 (2304x1728)"
          zh_Hans: "通用 2K · 4:3 (2304x1728)"
      - value: "1728x2304"
        label:
          en_US: "Universal 2K · 3:4 (1728x2304)"
          zh_Hans: "通用 2K · 3:4 (1728x2304)"
      - value: "2848x1600"
        label:
          en_US: "Universal 2K · 16:9 (2848x1600)"
          zh_Hans: "通用 2K · 16:9 (2848x1600)"
      - value: "1600x2848"
        label:
          en_US: "Universal 2K · 9:16 (1600x2848)"
          zh_Hans: "通用 2K · 9:16 (1600x2848)"
      - value: "2496x1664"
        label:
          en_US: "Universal 2K · 3:2 (2496x1664)"
          zh_Hans: "通用 2K · 3:2 (2496x1664)"
      - value: "1664x2496"
        label:
          en_US: "Universal 2K · 2:3 (1664x2496)"
          zh_Hans: "通用 2K · 2:3 (1664x2496)"
      - value: "3136x1344"
        label:
          en_US: "Universal 2K · 21:9 (3136x1344)"
          zh_Hans: "通用 2K · 21:9 (3136x1344)"
      # ===== 通用 4K（5.0 Lite / 4.5 / 4.0） =====
      - value: "4096x4096"
        label:
          en_US: "Universal 4K · 1:1 (4096x4096)"
          zh_Hans: "通用 4K · 1:1 (4096x4096)"
      - value: "4704x3520"
        label:
          en_US: "Universal 4K · 4:3 (4704x3520)"
          zh_Hans: "通用 4K · 4:3 (4704x3520)"
      - value: "3520x4704"
        label:
          en_US: "Universal 4K · 3:4 (3520x4704)"
          zh_Hans: "通用 4K · 3:4 (3520x4704)"
      - value: "5504x3040"
        label:
          en_US: "Universal 4K · 16:9 (5504x3040)"
          zh_Hans: "通用 4K · 16:9 (5504x3040)"
      - value: "3040x5504"
        label:
          en_US: "Universal 4K · 9:16 (3040x5504)"
          zh_Hans: "通用 4K · 9:16 (3040x5504)"
      - value: "4992x3328"
        label:
          en_US: "Universal 4K · 3:2 (4992x3328)"
          zh_Hans: "通用 4K · 3:2 (4992x3328)"
      - value: "3328x4992"
        label:
          en_US: "Universal 4K · 2:3 (3328x4992)"
          zh_Hans: "通用 4K · 2:3 (3328x4992)"
      - value: "6240x2656"
        label:
          en_US: "Universal 4K · 21:9 (6240x2656)"
          zh_Hans: "通用 4K · 21:9 (6240x2656)"
      # ===== 5.0 Lite 3K 独占 =====
      - value: "3072x3072"
        label:
          en_US: "5.0 Lite 3K · 1:1 (3072x3072)"
          zh_Hans: "5.0 Lite 3K · 1:1 (3072x3072)"
      - value: "3456x2592"
        label:
          en_US: "5.0 Lite 3K · 4:3 (3456x2592)"
          zh_Hans: "5.0 Lite 3K · 4:3 (3456x2592)"
      - value: "2592x3456"
        label:
          en_US: "5.0 Lite 3K · 3:4 (2592x3456)"
          zh_Hans: "5.0 Lite 3K · 3:4 (2592x3456)"
      - value: "4096x2304"
        label:
          en_US: "5.0 Lite 3K · 16:9 (4096x2304)"
          zh_Hans: "5.0 Lite 3K · 16:9 (4096x2304)"
      - value: "2304x4096"
        label:
          en_US: "5.0 Lite 3K · 9:16 (2304x4096)"
          zh_Hans: "5.0 Lite 3K · 9:16 (2304x4096)"
      - value: "3744x2496"
        label:
          en_US: "5.0 Lite 3K · 3:2 (3744x2496)"
          zh_Hans: "5.0 Lite 3K · 3:2 (3744x2496)"
      - value: "2496x3744"
        label:
          en_US: "5.0 Lite 3K · 2:3 (2496x3744)"
          zh_Hans: "5.0 Lite 3K · 2:3 (2496x3744)"
      - value: "4704x2016"
        label:
          en_US: "5.0 Lite 3K · 21:9 (4704x2016)"
          zh_Hans: "5.0 Lite 3K · 21:9 (4704x2016)"
      # ===== 5.0 Pro 专属 2K（与通用 2K 同档但像素不同） =====
      - value: "2368x1776"
        label:
          en_US: "5.0 Pro 2K · 4:3 (2368x1776)"
          zh_Hans: "5.0 Pro 2K · 4:3 (2368x1776)"
      - value: "1776x2368"
        label:
          en_US: "5.0 Pro 2K · 3:4 (1776x2368)"
          zh_Hans: "5.0 Pro 2K · 3:4 (1776x2368)"
      - value: "2816x1584"
        label:
          en_US: "5.0 Pro 2K · 16:9 (2816x1584)"
          zh_Hans: "5.0 Pro 2K · 16:9 (2816x1584)"
      - value: "1584x2816"
        label:
          en_US: "5.0 Pro 2K · 9:16 (1584x2816)"
          zh_Hans: "5.0 Pro 2K · 9:16 (1584x2816)"
      # ===== 1K（5.0 Pro 与 4.0 部分共享） =====
      - value: "1024x1024"
        label:
          en_US: "5.0 Pro/4.0 1K · 1:1 (1024x1024)"
          zh_Hans: "5.0 Pro/4.0 1K · 1:1 (1024x1024)"
      - value: "1152x864"
        label:
          en_US: "5.0 Pro/4.0 1K · 4:3 (1152x864)"
          zh_Hans: "5.0 Pro/4.0 1K · 4:3 (1152x864)"
      - value: "864x1152"
        label:
          en_US: "5.0 Pro/4.0 1K · 3:4 (864x1152)"
